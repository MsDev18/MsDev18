    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76E6DA" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#76E6DA"/>
      <stop offset="0.7" stop-color="#83B7FF"/>
      <stop offset="1" stop-color="#83B7FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1160 55) rotate(142) scale(660 450)" gradientUnits="userSpaceOnUse">
