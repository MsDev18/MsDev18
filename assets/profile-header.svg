      <stop offset="1" stop-color="#13243A"/>
    </linearGradient>
    <linearGradient id="accent" x1="72" y1="220" x2="620" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76E6DA"/>
      <stop offset="1" stop-color="#83B7FF"/>
