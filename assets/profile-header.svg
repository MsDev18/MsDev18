<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MsDev18 — Frontend craft. Backend depth.</title>
  <desc id="desc">Full-stack developer profile banner with an interface, Go services, and SQL and Redis data architecture.</desc>
  <defs>
